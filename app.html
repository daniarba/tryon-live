<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TryOn Live</title>
<style>
:root{
  --bg:#05060a; --panel:rgba(18,22,34,.66); --panel2:rgba(255,255,255,.05); --line:rgba(255,255,255,.09);
  --text:#eef1f8; --muted:#9aa6bd; --acc:#6c5cff; --acc2:#3f8cff; --glow:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;color:var(--text);font:14px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;
  background:radial-gradient(900px 520px at 8% -10%, rgba(108,92,255,.16), transparent 60%),
             radial-gradient(900px 560px at 105% 110%, rgba(63,140,255,.13), transparent 60%), var(--bg);}
#app{display:flex;height:100%;}
#side{width:300px;min-width:300px;margin:14px 0 14px 14px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;box-shadow:var(--glow);}
#side .head{padding:16px 18px 4px;display:flex;align-items:baseline;gap:8px;}
#side .head b{font-size:15px;letter-spacing:.2px;background:linear-gradient(135deg,#fff,#b9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
#cnt{color:var(--muted);font-size:12px;}
#search{margin:10px 14px 8px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none;width:calc(100% - 28px);font-size:13px;transition:border-color .2s;}
#search::placeholder{color:#6f7b93;}
#search:focus{border-color:rgba(108,92,255,.7);}
#chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:12.5px;transition:all .15s;}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(108,92,255,.4);}
#grid{flex:1;overflow-y:auto;padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;scrollbar-width:thin;}
#grid::-webkit-scrollbar{width:6px}#grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:9px;cursor:grab;user-select:none;position:relative;transition:transform .18s, box-shadow .18s, border-color .18s;}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.45);border-color:rgba(255,255,255,.18);}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:11px;display:block;pointer-events:none;}
.card .nm{margin-top:7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cdd6e6;}
.card.sel{border-color:transparent;box-shadow:0 0 0 2px var(--acc),0 0 22px rgba(108,92,255,.35);}
.card .del{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:999px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:none;font-size:13px;line-height:1;backdrop-filter:blur(6px);}
.card.up .del{display:block;}
.card.upl{display:flex;align-items:center;justify-content:center;min-height:120px;border-style:dashed;color:var(--muted);text-align:center;font-size:12.5px;cursor:pointer;}
.card.upl:hover{color:var(--text);border-color:var(--acc);}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px 14px 14px 10px;min-width:0;}
#cv{max-width:100%;max-height:100%;border-radius:26px;background:#000;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.4), var(--glow);}
#cv.drag{outline:2px dashed var(--acc);outline-offset:-8px;}
#flash{position:absolute;inset:14px;background:#fff;opacity:0;pointer-events:none;border-radius:26px;transition:opacity .35s;}
.pill{position:absolute;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(10,13,20,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);font-size:12.5px;z-index:6;max-width:70%;box-shadow:0 8px 30px rgba(0,0,0,.35);}
#status{top:18px;left:20px;}
#fps{top:18px;right:20px;font-variant-numeric:tabular-nums;}
.dot{width:8px;height:8px;border-radius:50%;background:#f5a524;flex:0 0 auto;box-shadow:0 0 8px rgba(245,165,36,.7);}
.dot.ok{background:#2dd4a7;box-shadow:0 0 8px rgba(45,212,167,.7);}
#top{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center;}
#top select,#top .btn{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(12,16,26,.62);color:var(--text);font-size:12.5px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;max-width:200px;min-width:0;color-scheme:dark;transition:border-color .15s;}
#top select:hover,#top .btn:hover{border-color:rgba(255,255,255,.25);}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:26px;background:rgba(12,16,26,.66);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 16px 50px rgba(0,0,0,.5);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 40px);z-index:5;}
.btn{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap;transition:all .15s;}
.btn:hover{filter:brightness(1.2);border-color:rgba(255,255,255,.25);}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600;box-shadow:0 6px 20px rgba(108,92,255,.45);}
.btn.primary:hover{box-shadow:0 8px 26px rgba(108,92,255,.6);}
.sl{display:flex;flex-direction:column;gap:5px;min-width:92px;}
.sl label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:999px;background:rgba(255,255,255,.14);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 4px rgba(108,92,255,.22), 0 2px 6px rgba(0,0,0,.4);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));}
body.kiosk #top, body.kiosk #dock .sl, body.kiosk #status{display:none;}
body.kiosk #side{width:360px;min-width:360px;}
body.kiosk #grid{grid-template-columns:1fr 1fr;}
body.kiosk .card{padding:14px;}
body.kiosk .card .nm{font-size:15px;}
#kexit{display:none;position:absolute;bottom:20px;left:20px;z-index:7;}
body.kiosk #kexit{display:inline-flex;}
@media (max-width:760px){
  #app{flex-direction:column;}
  #stage{height:60%;order:1;padding:10px;}
  #side{order:2;width:calc(100% - 20px);min-width:0;height:40%;margin:0 10px 10px;border-radius:20px;}
  #dock{gap:10px;padding:10px 12px;border-radius:20px;}
}
#recap[hidden]{display:none;}#recap{position:absolute;inset:0;background:rgba(5,6,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:26px;}
#recap .rbox{width:min(700px,94%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--glow);}
#recap h3{margin:0;font-size:15px;letter-spacing:.2px;}
#recVid{width:100%;border-radius:16px;background:#000;max-height:52vh;}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;}
.rdot{width:8px;height:8px;border-radius:50%;background:#ff4d5e;flex:0 0 auto;box-shadow:0 0 8px #ff4d5e;animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.4;}}
</style></head>
<body>
<video id="video" playsinline muted style="display:none"></video>
<div id="app">
 <aside id="side">
  <div class="head"><b>TryOn Live</b><span id="cnt"></span></div>
  <input id="search" placeholder="Search garments…"/>
  <div id="chips"></div>
  <div id="grid"></div>
 </aside>
 <main id="stage">
  <canvas id="cv" width="960" height="720"></canvas>
  <div id="flash"></div>
  <div id="top">
   <select id="cam"></select>
   <select id="qual"><option value="0">Fast</option><option value="1" selected>Balanced</option><option value="2">Best</option></select>
   <select id="matte"><option value="1" selected>AI matting (ModNet)</option><option value="0">Basic matting</option></select>
   <button class="btn" id="mirror">Mirror</button>
   <button class="btn" id="kiosk">Kiosk</button>
  </div>
  <div id="status" class="pill"><span class="dot"></span><span id="recDot" class="rdot" hidden></span><span id="stTxt">Start karne ke liye "Start camera" dabain</span></div>
  <div id="fps" class="pill"><span id="fpsTxt">&#8211; FPS</span></div>
  <div id="dock">
   <button class="btn primary" id="start">Start camera</button>
   <div class="sl"><label>Size</label><input type="range" id="sSize" min="0.6" max="1.6" step="0.01" value="1"></div>
   <div class="sl"><label>Up/Down</label><input type="range" id="sDy" min="-0.25" max="0.25" step="0.005" value="0"></div>
   <div class="sl"><label>Left/Right</label><input type="range" id="sDx" min="-0.2" max="0.2" step="0.005" value="0"></div>
   <div class="sl"><label>Rotation</label><input type="range" id="sRot" min="-0.6" max="0.6" step="0.01" value="0"></div>
   <div class="sl"><label>Opacity</label><input type="range" id="sOp" min="0.3" max="1" step="0.01" value="0.96"></div>
   <button class="btn" id="snap">Save photo</button>
  </div>
  <div id="recap" hidden>
   <div class="rbox">
    <h3>Session recap</h3>
    <video id="recVid" controls loop autoplay playsinline></video>
    <div class="rbtns">
     <button class="btn primary" id="recDl">Download</button>
     <button class="btn" id="recShare">Share</button>
     <button class="btn" id="recClose">Close</button>
    </div>
   </div>
  </div>
  <button class="btn" id="kexit">Exit kiosk</button>
 </main>
</div>
<input type="file" id="upload" accept="image/*" multiple style="display:none"/>
<script src="lib/pose.js?v=2"></script>
<script src="fit.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TryOn Live</title>
<style>
:root{
  --bg:#0b0e14; --panel:#121722; --panel2:#171d2a; --line:rgba(255,255,255,.08);
  --text:#e8ecf4; --muted:#93a0b4; --acc:#5b8cff; --acc2:#8f6bff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
#app{display:flex;height:100%;}
#side{width:288px;min-width:288px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
#side .head{padding:14px 16px 6px;display:flex;align-items:baseline;gap:8px;}
#side .head b{font-size:15px;}
#cnt{color:var(--muted);font-size:12px;}
#search{margin:6px 12px 8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none;width:calc(100% - 24px);}
#search:focus{border-color:var(--acc);}
#chips{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:12.5px;}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;}
#grid{flex:1;overflow-y:auto;padding:4px 12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
#grid::-webkit-scrollbar{width:8px}#grid::-webkit-scrollbar-thumb{background:#2a3242;border-radius:4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:grab;user-select:none;position:relative;transition:transform .15s, box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35);}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:9px;display:block;pointer-events:none;}
.card .nm{margin-top:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);}
.card .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:none;font-size:12px;line-height:1;}
.card.up .del{display:block;}
.card.upl{display:flex;align-items:center;justify-content:center;min-height:120px;border-style:dashed;color:var(--muted);text-align:center;font-size:12.5px;cursor:pointer;}
.card.upl:hover{color:var(--text);border-color:var(--acc);}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;min-width:0;}
#cv{max-width:100%;max-height:100%;border-radius:18px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#cv.drag{outline:3px dashed var(--acc);outline-offset:-6px;}
#flash{position:absolute;inset:18px;background:#fff;opacity:0;pointer-events:none;border-radius:18px;transition:opacity .35s;}
.pill{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(10,14,22,.72);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:12.5px;z-index:6;max-width:70%;}
#status{top:16px;left:16px;}
#fps{top:16px;right:16px;}
.dot{width:8px;height:8px;border-radius:50%;background:#f5a524;flex:0 0 auto;}
.dot.ok{background:#2dd4a7;}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center;}
#top select,#top .btn{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(13,18,28,.78);color:var(--text);font-size:12.5px;backdrop-filter:blur(10px);cursor:pointer;max-width:200px;min-width:0;color-scheme:dark;}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:rgba(13,18,28,.78);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 36px);z-index:5;}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap;}
.btn:hover{filter:brightness(1.15);}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600;}
.sl{display:flex;flex-direction:column;gap:2px;min-width:96px;}
.sl label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.sl input{width:100%;accent-color:var(--acc);}
body.kiosk #top, body.kiosk #dock .sl{display:none;}
body.kiosk #side{width:340px;min-width:340px;}
body.kiosk #grid{grid-template-columns:1fr 1fr;}
body.kiosk .card{padding:12px;}
body.kiosk .card .nm{font-size:15px;}
#kexit{display:none;position:absolute;bottom:16px;left:16px;z-index:7;}
body.kiosk #kexit{display:inline-flex;}
@media (max-width:760px){
  #app{flex-direction:column;}
  #stage{height:62%;order:1;}
  #side{order:2;width:100%;min-width:0;height:38%;border-right:none;border-top:1px solid var(--line);}
  #dock{gap:8px;padding:10px;}
}

#recap{position:absolute;inset:0;background:rgba(7,10,16,.93);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:18px;}
#recap .rbox{width:min(720px,94%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
#recap h3{margin:0;font-size:15px;}
#recVid{width:100%;border-radius:12px;background:#000;max-height:52vh;}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;}
.rdot{width:8px;height:8px;border-radius:50%;background:#ff4d5e;flex:0 0 auto;box-shadow:0 0 8px #ff4d5e;}
</style></head>
<body>
<video id="video" playsinline muted style="display:none"></video>
<div id="app">
 <aside id="side">
  <div class="head"><b>Catalog</b><span id="cnt"></span></div>
  <input id="search" placeholder="Search garments…"/>
  <div id="chips"></div>
  <div id="grid"></div>
 </aside>
 <main id="stage">
  <canvas id="cv" width="960" height="720"></canvas>
  <div id="flash"></div>
  <div id="top">
   <select id="cam"></select>
   <select id="qual"><option value="0">Fast</option><option value="1" selected>Balanced</option><option value="2">Best</option></select>
   <select id="matte"><option value="1" selected>AI matting (ModNet)</option><option value="0">Basic matting</option></select>
   <button class="btn" id="mirror">Mirror</button>
   <button class="btn" id="kiosk">Kiosk</button>
  </div>
  <div id="status" class="pill"><span class="dot"></span><span id="recDot" class="rdot" hidden></span><span id="stTxt">Start karne ke liye "Start camera" dabain</span></div>
  <div id="fps" class="pill"><span id="fpsTxt">&#8211; FPS</span></div>
  <div id="dock">
   <button class="btn primary" id="start">Start camera</button>
   <div class="sl"><label>Size</label><input type="range" id="sSize" min="0.6" max="1.6" step="0.01" value="1"></div>
   <div class="sl"><label>Up/Down</label><input type="range" id="sDy" min="-0.25" max="0.25" step="0.005" value="0"></div>
   <div class="sl"><label>Left/Right</label><input type="range" id="sDx" min="-0.2" max="0.2" step="0.005" value="0"></div>
   <div class="sl"><label>Rotation</label><input type="range" id="sRot" min="-0.6" max="0.6" step="0.01" value="0"></div>
   <div class="sl"><label>Opacity</label><input type="range" id="sOp" min="0.3" max="1" step="0.01" value="0.96"></div>
   <button class="btn" id="snap">Save photo</button>
  </div>

  <div id="recap" hidden>
   <div class="rbox">
    <h3>Session recap</h3>
    <video id="recVid" controls loop autoplay playsinline></video>
    <div class="rbtns">
     <button class="btn primary" id="recDl">Download</button>
     <button class="btn" id="recShare">Share</button>
     <button class="btn" id="recClose">Close</button>
    </div>
   </div>
  </div>
  <button class="btn" id="kexit">Exit kiosk</button>
 </main>
</div>
<input type="file" id="upload" accept="image/*" multiple style="display:none"/>
<script src="lib/pose.js?v=2"></script>
<script src="fit.js?v=2"></script>
<script src="app.js?v=4"></script>
</body>
</html>
